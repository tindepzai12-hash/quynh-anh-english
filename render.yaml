services:
  - type: web
    name: quynh-anh-english
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev && python3 --version
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_BIN
        value: python3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
